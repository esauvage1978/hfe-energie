    <text x="50" y="170" text-anchor="middle" font-family="Arial" font-weight="700" font-size="12" fill="#7f1d1d">Chauffage</text>
  </g>
  <text x="200" y="40" text-anchor="middle" font-family="Arial" font-weight="800" font-size="18" fill="#0c4a6e">Pompe à chaleur air-eau</text>
  <text x="200" y="270" text-anchor="middle" font-family="Arial" font-weight="600" font-size="13" fill="#0369a1">SCOP jusqu'à 4,5 · Jusqu'à 75 % d'économies</text>
