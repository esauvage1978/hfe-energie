<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Schéma d'une pompe à chaleur air-eau">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <g transform="translate(50, 90)">
    <rect width="120" height="120" rx="10" fill="#f8fafc" stroke="#0369a1" stroke-width="3"/>
    <circle cx="60" cy="60" r="35" fill="none" stroke="#0369a1" stroke-width="3"/>
    <circle cx="60" cy="60" r="22" fill="none" stroke="#0ea5e9" stroke-width="3"/>
    <line x1="40" y1="60" x2="80" y2="60" stroke="#0369a1" stroke-width="3"/>
    <line x1="60" y1="40" x2="60" y2="80" stroke="#0369a1" stroke-width="3"/>
  </g>
  <g stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round">
